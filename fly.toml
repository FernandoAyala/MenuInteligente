# Configuración para desplegar el backend en Fly.io
# Ajusta "app" al nombre de tu app en Fly (fly apps create <app-name>)
app = "menu-inteligente-api"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25

# Healthcheck HTTP contra /health
[[checks]]
  name = "health"
  type = "http"
  port = 3000
  interval = "15s"
  timeout = "10s"
  grace_period = "40s"
  method = "get"
  path = "/health"
